name: Reference Documentation
description: Report a question or correction involving scoring definitions or source documentation
title: "[Reference Documentation]: "
labels: [documentation]
body:
  - type: input
    id: standard
    attributes:
      label: Standard and version
      placeholder: AHA2022 / 2022.1
    validations:
      required: true
  - type: dropdown
    id: metric
    attributes:
      label: Metric
      options:
        - diet
        - physical_activity
        - nicotine
        - sleep
        - bmi
        - blood_lipids
        - blood_glucose
        - blood_pressure
    validations:
      required: true
  - type: dropdown
    id: population
    attributes:
      label: Population
      options:
        - adult
        - pediatric
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Reference and exact locator
      description: Include DOI or URL plus page, table, supplement, and row.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Question, correction, or discrepancy
      description: Describe the relevant boundary, modifier, precedence, or reference behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Independent calculation or evidence
      description: Do not use package output as the expected result.
